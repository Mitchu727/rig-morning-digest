name: Publish S01E04 review preview

on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: Include the temporary lane marker in the public preview
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the default branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.25.0
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the project
        run: |
          pnpm test
          pnpm typecheck

      - name: Require the marker secret for a marked preview
        if: ${{ inputs.include_marker }}
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: |
          if [ -z "${LANE_MARKER//[[:space:]]/}" ]; then
            echo "::error::Add the LANE_MARKER Actions secret before publishing a marked preview."
            exit 1
          fi

      - name: Render the page outside the repository
        env:
          LANE_ID: ${{ vars.LANE_ID || 'lane-07' }}
          LANE_MARKER: ${{ inputs.include_marker && secrets.LANE_MARKER || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/rig-preview"
          pnpm run preview:render "$RUNNER_TEMP/rig-preview/index.html"

      - name: Upload the temporary Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/rig-preview
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show the preview URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "${PAGE_URL%/}/" >> "$GITHUB_STEP_SUMMARY"
